  return base.match(/\.(?:jpe?g|png|webp|gif|svg)$/i)?base:base+".jpg";
};
const fallbackImg=(base,alt,extra="")=>`<img src="${assetSrc(base)}" data-base="${base}" alt="${alt}" ${extra} onerror="(function(i){const b=i.dataset.base||\"\";const exts=[\".JPG\",\".jpeg\",\".JPEG\",\".png\",\".PNG\",\".webp\"];let n=+(i.dataset.try||0);if(n<exts.length){i.dataset.try=n+1;i.src=b+exts[n];}else{i.onerror=null;}})(this)">`;
const fig=(k,c)=>`<figure class="fig rv">${fallbackImg(IMG[k],c,"loading=\"lazy\"")}<figcaption>${c}</figcaption></figure>`;
const card=(p,c)=>`<a class="pc ${p.big?'':'sm'} ${c||''} rv" href="#/project/${p.id}"><div class="v">${p.img?fallbackImg(IMG[p.img],p.title+" figure"): `<em>${p.n}</em>`}</div><div class="t"><span class="mono">${p.n} · ${p.cat}</span><h3>${p.title}</h3><p>${p.sum}</p>${p.tools.map(t=>`<span class="tg">${t}</span>`).join("")}<div class="mv" style="margin-top:8px">View project →</div></div></a>`;
const ph=(a,t,s)=>`<div class="w ph"><span class="mono">${a}</span><h1>${t}</h1>${s?`<p class="lead">${s}</p>`:""}</div>`;
const portrait=`<div class="pf"><div class="fr"><div class="in">${PORTRAIT?`<img src="${PORTRAIT}" alt="Portrait of Zahir Sadik">`:`<div>Portrait placeholder<br>4:5 · 800×1000 px<br>set PORTRAIT in script</div>`}</div></div></div>`;
const jr=(a)=>`<div class="jr">${a.map(([d,t,x])=>`<div class="rv"><span class="mono">${d}</span><h3>${t}</h3><span style="color:var(--mu)">${x}</span></div>`).join("")}</div>`;
const J=[["Aug 2022 – Sept 2026","B.Sc. in EEE, Islamic University of Technology","CGPA 3.86. Power Systems I–III, Renewable Energy System, Operation & Control, Protection, Power Electronics."],["2023 – 2026","Head of Logistics, IEEE RAS IUT Student Branch","Robotics competitions and seminars."],["2023 – 2025","Senior Electrical Subteam Member, Project Altair","Electrical design and PCB development; International Rover Challenge 2024: 6th place, ABEX Task Winner."],["Sept – Nov 2025","Industrial training","BPDB Ghorashal Power Plant · Walton Hi-Tech · Robi Axiata · Bangladesh Atomic Energy Commission."],["2026","Undergraduate thesis","EV charging, PV, wind and BESS harmonic study."]];
const R={
"":()=>`<div class="w hero"><div><h1>Zahir<br>Sadik</h1><div class="themes"><span>Power Systems</span><span>Renewable Energy</span><span>Intelligent Energy Systems</span></div><p class="lead">Electrical and Electronic Engineering graduate from Islamic University of Technology (IUT) with a background in power and energy systems, renewable energy, intelligent technologies and engineering research.</p><p><a class="btn" href="${CV_URL}">Download CV</a> &nbsp; <a href="#/projects" class="mv">View Projects →</a></p></div>${portrait}</div>
<div class="w"><div class="snap rv"><div><span class="mono">Degree</span><b>B.Sc. EEE</b>Islamic University of Technology</div><div><span class="mono">CGPA</span><b>3.86</b>out of 4.00</div><div><span class="mono">Focus</span><b>Power &amp; Energy</b></div><div><span class="mono">Work</span><b>Research &amp; Projects</b></div></div></div>
<div class="w sec"><span class="sn">03 / RESEARCH FOCUS</span><h2>Research themes</h2><div class="rt rv"><div><b>Power Systems</b><small>Dispatch, operation</small></div><div><b>Renewable Energy</b><small>PV, wind, BESS</small></div><div><b>Power Quality</b><small>Harmonics, IEEE limits</small></div><div><b>EV Integration</b><small>Charging profiles</small></div><div><b>Intelligent Energy</b><small>Forecasting, optimization</small></div></div><p><a class="mv" href="#/research">Undergraduate thesis →</a></p></div>

<div class="w sec"><span class="sn">05 / ENGINEERING JOURNEY</span><h2>Journey</h2>${jr(J)}</div>
<div class="w sec"><span class="sn">06 / TECHNICAL AREAS</span><h2>Technical areas</h2><div class="rt rv"><div><b>Power tools</b><small>DIgSILENT PowerFactory, ETAP, PowerWorld</small></div><div><b>Analysis</b><small>MATLAB, Python, Simulink</small></div><div><b>Electronics</b><small>Proteus, PSpice, EAGLE</small></div><div><b>Embedded</b><small>8051, Assembly, C</small></div><div><b>Reporting</b><small>LaTeX, technical writing</small></div></div></div>
<div class="w"><div class="cta rv"><h2>Interested in research, engineering collaboration or technical work?</h2><a class="btn" href="${CV_URL}">View CV</a><a class="btn o" href="#/contact">Contact me</a></div></div>`,
about:()=>`${ph("About","ZAHIR SADIK")}<div class="w two"><div>${portrait}</div><div><p class="lead" style="color:var(--tx)">I am an Electrical and Electronic Engineering graduate from the Islamic University of Technology (IUT), with a keen interest in power and energy systems, renewable energy, intelligent technologies and engineering research. My academic journey has encompassed multidisciplinary projects, research initiatives, robotics and technology driven problem solving. I aspire to contribute to the world through my intellectual curiosity, analytical thinking and a culture of continuous learning, with a particular interest in translating intricate engineering concepts into coherent, practical solutions. Through my work, I aim to contribute to impactful research, cultivate innovation and continually evolve as an engineer and educator.</p><h3>Research interests</h3><p>Renewable Energy · Optimization · EV Integration · Harmonics Mitigation · Energy Systems · Grid Stability</p></div></div>
<div class="w sec"><h2>Education</h2><div class="ed rv"><span class="mono">2022 – 2026</span><div><h3>Islamic University of Technology</h3>B.Sc. in Electrical and Electronic Engineering · CGPA 3.86</div></div><div class="ed rv"><span class="mono">2021</span><div>HSC, Rajuk Uttara Model College · GPA 5.00</div></div><div class="ed rv"><span class="mono">2019</span><div>SSC, Rajuk Uttara Model College · GPA 5.00</div></div></div>`,
research:()=>{const p=P[0];return `${ph("Undergraduate thesis","EV Charging Impacts with PV, Wind and BESS in a 9-Bus Microgrid","Uncertainty-based study with harmonic mitigation. Supervised by Prof. Dr. Ashik Ahmed, IUT EEE.")}<div class="w two r"><div><span class="sn">01 / PROBLEM</span><p>${p.prob}</p><span class="sn">02 / SYSTEM MODEL</span><p>${p.arch}</p></div><div>${fig("poster","Thesis poster with 9-bus single-line diagram")}</div></div>
<div class="w sec"><span class="sn">03 / METHODOLOGY</span><h2>Research workflow</h2><div class="flow rv">${["EV charging (NREL EVI-Pro profile, Bus 4)","Renewable integration (PV, wind, BESS)","Uncertainty modelling: AR(1) Monte Carlo, 300 scenarios","Power-system simulation: DIgSILENT PowerFactory","Harmonic analysis: harmonic load flow, 5% THD limit","Mitigation: BESS converter injection optimized by PSO / DE"].map(x=>`<div>${x}</div>`).join("")}</div><p class="note rv" style="max-width:640px">Monte Carlo generates uncertainty scenarios. Mitigation comes from the optimized BESS harmonic injection.</p></div>
<div class="w sec"><span class="sn">04 / RESULTS</span><h2>Results</h2><div class="sc rv"><table><tr><th>Case</th><th>Outcome</th></tr>${p.res.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div><p>Converter headroom, not the optimizer, limited mitigation.</p><span class="sn">05 / CONTRIBUTION</span><p>An uncertainty-aware harmonic assessment using real Bangladesh renewable data; BESS converters used for harmonic compensation alongside energy management; quantified converter-rating requirements.</p>${p.tools.map(t=>`<span class="tg">${t}</span>`).join("")}<p><a class="btn" href="#/project/thesis">Full case study</a></p></div>`},
projects:()=>`${ph("Projects","Engineering case studies","Power and energy work leads; supporting course projects show breadth.")}<div class="w"><div class="chips" id="ch">${[["all","All"],["pe","Power & Energy"],["ml","AI / ML"],["de","Digital / Electronics"],["em","Embedded"],["mt","MATLAB"]].map((c,i)=>`<button data-f="${c[0]}" class="${i?'':'on'}">${c[1]}</button>`).join("")}</div><div class="fg2" id="pg" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${P.map(p=>`<div data-k="${p.k}" ${p.big?'style="grid-column:span 1"':''}>${p.nolink?card({...p,id:"x"}).replace('href="#/project/x"','href="#/experience"'):card(p)}</div>`).join("")}</div></div>`,
experience:()=>`${ph("Experience","Training, leadership and robotics")}<div class="w">${[["Sept 2025","Bangladesh Power Development Board","Industrial Trainee, Ghorashal Power Plant · Palash, Narsingdi"],["Oct 2025","Walton Hi-Tech Industries PLC","Industrial Trainee, Technical Division · Chandra, Gazipur"],["Nov 2025","Robi Axiata Limited","Industrial Trainee, Technical Division · Gulshan, Dhaka"],["Nov 2025","Bangladesh Atomic Energy Commission","Industrial Trainee, Electrical Division · Savar, Dhaka"]].map(([d,t,x])=>`<div class="ed rv"><span class="mono">${d}</span><div><h3>${t}</h3>${x}</div></div>`).join("")}<div class="ed rv"><span class="mono">2023 – 2026</span><div><h3>IEEE Robotics and Automation Society, IUT Student Branch</h3>Head of Logistics<ul><li>Managed logistics for robotics competitions and society events</li><li>Led planning and execution of competitions and seminars</li></ul></div></div><div class="ed rv"><span class="mono">2023 – 2025</span><div><h3>Project Altair</h3>Senior Electrical Subteam Member<ul><li>Electrical system design and PCB development for robotics projects</li><li>Mentored juniors in power electronics and circuit design</li><li>International Rover Challenge 2024: 6th place, ABEX Task Winner</li></ul></div></div><p class="note">Training descriptions: the CV lists only organization, division and date.</p></div>`,
cv:()=>`${ph("Curriculum vitae","CV")}<div class="w"><a class="btn" href="${CV_URL}" download>Download CV</a><div class="pdfbox" style="margin-top:24px;max-width:900px"><object data="${CV_URL}" type="application/pdf" width="100%" height="900"><p>CV preview is not available in this browser. <a href="${CV_URL}">Open the CV PDF</a>.</p></object></div></div>`, 
contact:()=>`${ph("Contact","Get in touch","Research, engineering collaboration or technical work.")}<div class="w cl"><a href="mailto:zahirsadik.19@gmail.com"><span class="mono">Email</span><br><b>zahirsadik.19@gmail.com</b></a><a href="${LINKEDIN}"><span class="mono">LinkedIn</span><br><b>linkedin.com/in/zahirsadik</b></a><a href="#/"><span class="mono">Location</span><br><b>Dhaka, Bangladesh</b></a></div><div class="w"><div class="cta rv"><h2>Let's talk about power and energy systems.</h2><a class="btn" href="mailto:zahirsadik.19@gmail.com">Email me</a></div></div>`,
project:id=>{const p=P.find(x=>x.id==id);if(!p)return R[""]();const L=(h,c)=>c?`<div class="ed rv"><span class="mono">${h}</span><div>${c}</div></div>`:"";
return `${ph(p.cat,p.title,p.sum)}<div class="w">${p.tools.map(t=>`<span class="tg">${t}</span>`).join("")}${L("01 Overview",p.ov)}${L("02 Problem",p.prob)}${L("03 Objective",p.obj&&p.obj.length?`<ul>${p.obj.map(o=>`<li>${o}</li>`).join("")}</ul>`:"")}${L("04 Method",p.meth?`<ul>${p.meth.map(o=>`<li>${o}</li>`).join("")}</ul>`:"")}${L("05 Architecture",p.arch)}${L("06 Implementation",p.impl)}${L("07 Results",p.res?`<div class="sc"><table>${p.res.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table></div>`:"")}${L("08 Contribution",p.con)}${p.note?`<p class="note">${p.note}</p>`:""}${p.figs&&p.figs.length?`<div class="fg2" style="margin-top:24px">${p.figs.map(f=>fig(f[0],f[1])).join("")}</div>`:p.gnote?`<div class="gph" style="margin-top:24px">${p.gnote}</div>`:""}${p.rep?`<div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="assets/documents/${encodeURIComponent(p.rep).replace(/%2F/g,"/")}" target="_blank" rel="noopener">View report ↗</a><a class="btn o" href="assets/documents/${encodeURIComponent(p.rep).replace(/%2F/g,"/")}" download>Download report</a></div>`:""}<p><a class="mv" href="#/projects">← All projects</a></p></div>`}};
function route(){const h=(location.hash||"#/").replace(/^#\/?/,"");const [a,b]=h.split("/");let f=a=="project"?()=>R.project(b):R[a]||R[""];app.innerHTML=f();
const cur=R[a]?a:(a=="project"?"projects":"");document.querySelectorAll("nav a.l").forEach(x=>x.classList.toggle("on",x.dataset.r==cur));$("#mn").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");
document.title=(a?a[0].toUpperCase()+a.slice(1)+" — ":"")+"Zahir Sadik";scrollTo(0,0);
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&(x.target.classList.add("in"),io.unobserve(x.target))),{threshold:.1});app.querySelectorAll(".rv").forEach(x=>io.observe(x));
const ch=$("#ch");if(ch)ch.onclick=e=>{const f=e.target.dataset.f;if(!f)return;ch.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b==e.target));document.querySelectorAll("#pg>div").forEach(d=>d.style.display=f=="all"||d.dataset.k.split(" ").includes(f)?"":"none")}}
$("#mn").innerHTML=NAV.map(([r,t])=>`<a class="l" data-r="${r}" href="#/${r}">${t}</a>`).join("");
$("#mb").onclick=()=>{const o=$("#mn").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"};
addEventListener("scroll",()=>$("#hd").classList.toggle("s",scrollY>20));addEventListener("hashchange",route);route();
</script></body></html>
